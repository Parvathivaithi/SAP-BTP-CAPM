_schema-version: 3.3.0
ID: Training_Application
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: Training_Application-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Training_Application-auth
      - name: Training_Application-db
      - name: Training_Application-destination

  - name: Training_Application-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Training_Application-db
  - name: Training_Application
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: Training_Application-auth
      - name: Training_Application-destination
      - name: Training_Application-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: Training_Application-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: Training_Applicationemp
          artifacts:
            - emp.zip
          target-path: app/
        - name: Training_Applicationtraining
          artifacts:
            - training.zip
          target-path: app/
    requires:
      - name: Training_Application-auth
      - name: srv-api
      - name: Training_Application-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  - name: Training_Applicationemp
    type: html5
    path: app/emp
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: Training_Applicationtraining
    type: html5
    path: app/training
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: Training_Application-destinations
    type: com.sap.application.content
    requires:
      - name: Training_Application-auth
        parameters:
          service-key:
            name: Training_Application-auth-key
      - name: Training_Application-html5-repo-host
        parameters:
          service-key:
            name: Training_Application-html5-repo-host-key
      - name: srv-api
      - name: Training_Application-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: Training_Application-html5-repository
              ServiceInstanceName: Training_Application-html5-repo-host
              ServiceKeyName: Training_Application-html5-repo-host-key
              sap.cloud.service: Training_Application.service
            - Name: Training_Application-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: Training_Application-auth
              ServiceKeyName: Training_Application-auth-key
              sap.cloud.service: Training_Application.service

resources:
  - name: Training_Application-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Training_Application-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Employee (Training_Application ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Employee'
          - name: 'Manager (Training_Application ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Manager'
          - name: 'Administrator (Training_Application ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Administrator'
    requires:
      - name: app-api
  - name: Training_Application-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: Training_Application-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true

    requires:
      - name: srv-api

  - name: Training_Application-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: Training_Application-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
